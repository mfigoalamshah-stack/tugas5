name: Build Figo5 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-figo5:
    runs-on: windows-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE (figo5)
        run: g++ -static "figo5.cpp" -o "figo5.exe"

      - name: Upload file EXE (figo5)
        uses: actions/upload-artifact@v4
        with:
          name: hasil-figo5
          path: "figo5.exe"
